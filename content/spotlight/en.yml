    text_short:
      "Digital accessibility is simply part of our work. Whether optimizing or redesigning digital
      products and services: We build a deep understanding of the users' realities of life and
      eliminate barriers."
    text_full:
      "Digital accessibility is simply part of our work. Whether optimizing or redesigning digital
      products and services: We build a deep understanding of the users' realities of life and
      eliminate barriers. This ensures that digital solutions can be used well by as many people as
      possible."
    image: spotlight/2.jpg
