spotlights:
  - title: Using AI with a Human-Centered Approach
    text_short:
      Artificial intelligence (AI) still holds untapped potential — but only when it is embedded
      meaningfully into products and processes. A human-centered approach pays off, from working
      with AI through to introducing entire AI product landscapes.
    text_full:
      A human-centered approach pays off from AI strategy to the design of entire AI product
      landscapes. Our experts set the right focus and help to unleash the full potential of
      AI-driven processes.
    image: spotlight/1.jpg
    services:
      - "Creating **foundations** for AI"
      - "**Exploring** AI potentials"
      - "**Realizing** AI solutions"
      - "**Transformation support**"
    pdf: /downloads/d-labs-ki-leistungspakete.pdf

  - title: Accessible from the Start
    # The short one is the full text without its closing sentence, matching how
