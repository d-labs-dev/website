  task: How can the customer interface of a distribution system operator be designed in a uniform way?
  goals:
  - Increased customer and service orientation
  - A unified customer experience across all channels
  - Process automation and digitalization
  - Increasing transparency for all stakeholders
  approaches:
  - Extensive analysis of internal and external service processes, e.g. with the help of [qualitative
    interviews](/en/methods/qualitative_survey/) with representatives of the various target groups,
    as well as workshops with process experts from different departments
  - Development of [personas](/en/methods/personas/) and mapping of the IS situation in [customer
    journey maps](/en/methods/customer_journey_maps/)
  - Co-creative development of a mission statement for a unified customer interface, elaboration of a
    customer-centric service design concept and illustration in [service blueprints](/en/methods/service_blueprint/)
  results:
  - Forward-thinking service concept for the realization of a uniform customer interface, e.g. with the
    help of an online self-service portal for the various customer groups
- lead: Project 02
  img1: projects/dlabs_project02-img01.jpg
  img2: projects/dlabs_project02-img02.jpg
  circle_img: projects/circle-small_project02.svg
  percentages:
    user_research: 5
    design: 0
    engineering: 0
    training: 85
    consulting: 10
  task: How do you train the employees of a DAX Group to be fit for agile working in interdisciplinary
    teams?
  goals:
  - Training of 25 employees from all over Europe to be Design Thinking Facilitators
  - Learn design thinking through generic challenges and internal projects and whereby teams coach themselves
  - Getting to know implementation strategies
  - Building knowledge about agile work in companies as well as planning projects and workshops
  approaches:
  - '[Introduction to design thinking](/en/methods/qualifying_coaches/): Getting to know the entire
    design thinking process using a generic challenge'
  - 'Deepening and coaching: Processing an internal challenge, whereby the participants acted as coaches
    themselves'
  - 'Implementation strategies: Presentation of Business Model Canvas, Value Proposition Canvas and Systems
    Thinking; Location Determination - Agility in the Organization'
  - 'Project and workshop planning: Order clarification and planning of internal projects'
  results:
  - Building knowledge on agile work within the company and practical experience in internal projects
  - Successful certification of participants as Design Thinking Facilitators
- lead: Project 03
  img1: projects/dlabs_project03-img01.jpg
  img2: projects/dlabs_project03-img02.jpg
  circle_img: projects/circle-small_project03.svg
  percentages:
    user_research: 5
    design: 25
    engineering: 65
    training: 0
    consulting: 5
  task: How can visitors to an exhibition be digitally supported?
  goals:
  - How can visitors to an exhibition be digitally supported?
  - Delivery of additional information about the exhibits presented in the exhibition
  - Support for the visitor orientation within the exhibition
  approaches:
  - Definition of an MVP (Minimum Viable Product) together with the customer based on existing research
    results
  - Deliver [co-creative workshops](/en/methods/co-creation/) with the customer and iterative development
    of concept and design based on [prototypes](/en/methods/evolutionary_prototyping/)
  - Agile implementation of the MVP and its expansion
  results:
  - Intuitively usable app for iOS and Android for visitor multimedia accompaniment and support during
    and after the exhibition visit
