intro_lead: Was wir machen
intro_text:
  Wir identifizieren die Bedürfnisse unserer Kunden, gestalten relevante Prozesse, konzipieren
  und optimieren digitale Produkte und Services, implementieren Software und befähigen unsere Kunden nachhaltig
  in diesen Aktivitäten.
intro_services_title: Unsere Kompetenzfelder
slides:
  - name: User Research
    img: approach/dlabs_approach-research.jpg
    img-position: center
    text:
      Wir erfassen die Bedürfnisse und Anforderungen, wir testen die Usability und User Experience.
      Wir sind der erfahrene Partner für unsere Kunden und begleiten die Konzeption und Entwicklung. Im
      Anschluss validieren wir die Prototypen und Produkte.
    color: yellow
  - name: Digital Experience Design
    img: approach/dlabs_approach-design.jpg
    img-position: center
    text:
      Wir sind Gestalter der Erfahrbarkeit von digitalen Produkten und Services. Im agilen Design-Prozess
      erarbeiten wir digitale Produkte und Services, die Menschen wirklich brauchen und optimal benutzen
      können. Wir arbeiten mit UX Researchern, Beratern und Software-Entwicklern Hand in Hand. Dabei beziehen
      wir den Kunden eng mit ein und validieren Lösungsansätze mit potenziellen Nutzern.
    color: darkBlue
  - name: Software Engineering
    img: approach/dlabs_approach-engineering.jpg
    img-position: center
    text:
      Wir sind Experten auf den Gebieten der Planung, Analyse, Konzeption und Implementierung von Anwendungssoftware
      und Webapplikationen für Desktop und Mobile.
    color: red
  - name: Enabling & Coaching
    img: approach/dlabs_approach-coaching.jpg
    img-position: top
    text:
      Wir befähigen unsere Kunden darin agil und nutzerzentriert zu arbeiten – nachhaltig und auf die
      jeweiligen individuellen Kundenbedürfnisse zugeschnitten. Dabei schöpfen unsere Coaches aus unseren
      jahrelangen Projekterfahrungen und den verschiedenen Expertisen eines interdisziplinären Teams.
    color: green
  - name: Business & Innovation
    img: approach/dlabs_approach-business.jpg
    img-position: center
    text:
      Als Spezialisten entwickeln wir gemeinsam mit unseren Kunden digitale Lösungen. Unsere langjährige
      Erfahrung und unsere persönliche Leidenschaft sind der perfekte Mix, gemeinsam die besten digitalen
      Services zu kreieren. Wir entwickeln Strategien und unterstützen unsere Kunden bei der strategischen
      Neuausrichtung.
    color: purple
