seo_title: Arbeitsweise
seo_description:
  D-LABS arbeitet nach den Ansätzen und Methoden des Design Thinking und Human-Centered
  Design.
intro_lead: Wie wir arbeiten
intro_text:
  " Die Arbeitsweise von D‑LABS orientiert sich an den Ansätzen und Methoden des **Design Thinking**
  und **Human-centered Design** und stellt immer den Nutzer in den Mittelpunkt. "
intro_cta_text: Unser Vorgehen in Projekten
slider_lead: Unser Vorgehen
screens:
  - title: Überblick
    text:
      In Abhängigkeit von der Aufgabenstellung kommen Leistungen aus unseren verschiedenen Kompetenzfeldern
      im Projekt zur Anwendung.
  - title: 360°-Sicht
    text: Ganzheitliche Analyse des Projekt­umfeldes und umfassende Untersuchung der Nutzer­bedürfnisse
  - title: Synthese
    text:
      Zusammenfassung, Strukturierung und Bewertung der in der 360°-Sicht gewonnenen Erkenntnisse und
      Definition der Anforderungen an die Lösung
  - title: Konzept & Design
    text: Ideenentwicklung, Prototyping und Ausarbeitung erster ­Lösungs­ansätze im interdisziplinären Team
  - title: Umsetzung
    text:
      Iterative Optimierung des ­Konzeptes bis hin zur Lösung, die den ­Bedürfnissen aller Stakeholder
      ­gerecht wird
  - title: Enabling & Coaching
    text:
      Befähigung und Begleitung aller Stakeholder in Innovations­prozessen und agilen Arbeits­weisen
      sowie Trainings zu digitalen Lösungen
  - title: Business & Innovation
    text: Strategische Beratung bei der Entwicklung digitaler Lösungen sowie in Innovations- und Changeprozessen
