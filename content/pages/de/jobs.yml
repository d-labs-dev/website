slider_title: Warum D-LABS?
slides:
  - name: Peter
    position: Senior User Researcher
    quote:
      Weil wir die Welt jeden Tag ein Stück zugänglicher machen. Mit unserem Fokus auf den Bedürfnissen
      der Endanwender, schaffen wir Lösungen die unsere Kunden begeistern. Hier wird User Experience gelebt.
    img: quotes/quote-peter.jpg
  - name: Claudia
    position: Director Digital Experience Design
    quote:
      Die enge Zusammenarbeit mit Experten aus verschiedenen Bereichen und mit unterschiedlichen Schwerpunkten
      ist immer wieder spannend. Auch die Bandbreite der Projekte für namhafte Kunden aus den unterschiedlichsten
      Branchen sorgt dafür, dass ich immer noch etwas dazu lernen kann. Nicht zuletzt schlägt mein Herz
      für Potsdam.
    img: quotes/quote-claudia.jpg
  - name: Hagen
    position: Sales, Networking & New Business
    quote:
      D-LABS bedeutet für mich, im agilen Miteinander interessante Ideen und Projekte zu entwickeln
      und digitale Lösungen zu schaffen – mit Menschen und für Menschen.
    img: quotes/quote-hagen.jpg
  - name: Nina
    position: Digital Experience Designer
    quote:
      Wir sind Spürnasen und Macher. Wozu lange fackeln? Wir wollen der Ursache auf den Grund gehen
      – und zwar gründlich!
    img: quotes/quote-nina.jpg
benefits_title: Unsere Benefits für dich!
benefits:
  - label: Weiterbildung
    img: job-benefits/icon-qualification.svg
    text:
      "Sei es die klassische Fortbildung, eine neue Sprache, der Blick über den Tellerrand des eigenen
      Fachbereichs oder der Ausbau unserer D-LABS Bibliothek: D-LABS unterstützt dich dabei, dich dahin
      zu entwickeln, wo Du hinwillst. Interne Formate fördern den Wissenstransfer im Team, während für externe
      Formate alle Kosten übernommen werden."
  - label: Flexibles Arbeiten
    img: job-benefits/icon-flexible-time.svg
    text:
      "New Work ist für uns Alltag. Bei D-LABS entscheidest du, welche Arbeitsweise dir am Besten gefällt.
      Ob Präsenzbüro oder Homeoffice, ob früher Vogel oder Nachteule – wir sagen: Die Mischung macht's!
      Auch zwischen unseren Standorten darf frei und bedarfsgerecht gewählt werden. Selbst wer gerne ein
      paar Monate im Jahr aus dem Ausland arbeitet, kommt auf seine Kosten. Das ist echte Flexibilität!"
  - label: Unternehmenskulur
    img: job-benefits/icon-teamevent.svg
    text:
      "Agil arbeiten heißt, auf Augenhöhe miteinander umzugehen. Teamübergreifend pflegen wir daher
      eine lockere und kreative Arbeitsatmosphäre und legen Wert darauf, dass jede Stimme Gewicht hat und
      gehört wird. So spannend unsere Projekte auch sind: Bei D-LABS arbeiten heißt, Mensch zu sein. Neben
      unseren Teammeetings organisieren wir daher regelmäßig Events, bei denen alle vorbeikommen und gemeinsam
      entspannen können."
  - label: Familienfreundlichkeit
    img: job-benefits/icon-family-friendliness.svg
    text:
      Für manche sind es die Kids, für andere der beste Freund des Menschen – zum Menschsein gehört
      die Familie und so ist es bei D-LABS selbstverständlich, Arbeitszeiten an den Zeitplan der Kinder
      anzupassen, für private Termine Platz im Kalender freizumachen oder den Familienhund mit in's Büro
      nehmen zu können.
