seo_description: Du möchtest dich in unser kreatives, interdisziplinäres D-LABS-Team einbringen?
title_text: Wer uns fehlt,<br/>**bist du!**
intro_text:
  Du möchtest dich in unser kreatives, interdisziplinäres Team einbringen? Dann schau dir unsere
  Jobangebote für dich an und sende uns deine Kontaktdaten! Der erste Schritt zum neuen Job bei D-LABS
  in Potsdam oder am Standort Berlin ist schnell gemacht.
list_title: Wir suchen dich
initiative_text:
  Dein Traumjob ist nicht aufgeführt? Kein Problem. Schreib uns einfach trotzdem und zeige
  uns, wie du unser Team verstärken könntest!
inclusivity_text:
  Ein Teil von D-LABS zu sein bedeutet so zu sein wie du bist! Daher gelten unsere Personenbezeichnungen
  natürlich für alle Geschlechteridentitäten.
