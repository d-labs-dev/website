version: 2
jobs:
  build:
    working_directory: ~/d-labs-website
    docker:
      - image: dlabspotsdam/website-build:latest
    steps:
      - checkout
      - restore_cache:
          key: bundle-v1-{{ checksum "Gemfile.lock" }}-{{ arch }}
      - run: bundle install
      - save_cache:
          key: bundle-v1-{{ checksum "Gemfile.lock" }}-{{ arch }}
          paths:
            - vendor/bundle
      - run:
          name: build jekyll
          command: |
            bundle exec jekyll contentful
            bundle exec jekyll build
          environment:
            JEKYLL_ENV: production
      - persist_to_workspace:
          root: ~/d-labs-website
          paths:
            - _site
      - store_artifacts:
          path: _site

  deploy:
    working_directory: ~/d-labs-website
    docker:
      - image: dlabspotsdam/website-build:latest
    steps:
      - checkout
      - attach_workspace:
          at: ~/d-labs-website
      - run:
          name: deploy to S3
          command: |
            export TARGET_S3_BUCKET=$(echo "$CIRCLE_BRANCH" | grep -Eq '^(master)$' && echo "d-labs.com" || echo "preview.d-labs.com")
            aws s3 sync ./_site/ s3://${TARGET_S3_BUCKET} --delete

  invalidate-cache:
    working_directory: ~/d-labs-website
    docker:
      - image: dlabspotsdam/website-build:latest
    steps:
      - run: aws cloudfront create-invalidation --distribution-id E9ENVGAMEA762 --paths '/*'

  # The Astro site. Its own image, because dlabspotsdam/website-build is Ruby and
  # has no Node; and its own deploy job on that Ruby image, because cimg/node has
  # no awscli. Neither has to grow a toolchain it does not already carry.
  build-astro:
    working_directory: ~/d-labs-website
    docker:
      - image: cimg/node:24.2
    steps:
      - checkout
      - run:
          name: enable pnpm
          # `corepack enable` writes its shims into /usr/local/bin, which the
          # `circleci` user cannot touch — the first run died on
          # `EACCES: unlink '/usr/local/bin/pnpm'`. cimg images give that user
          # passwordless sudo, which is the documented way round it; the fallback
          # installs the shims under $HOME instead, for an image that does not.
          command: |
            sudo corepack enable || corepack enable --install-directory "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            pnpm --version
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}-{{ arch }}
      - run: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}-{{ arch }}
          paths:
            - ~/.pnpm-store
      # `verify` is build + the legacy redirect map + the link crawl, so a broken
      # link fails the branch here rather than being found on the preview.
      - run:
          name: build and verify astro
          command: pnpm verify
      - persist_to_workspace:
          root: ~/d-labs-website
          paths:
            - dist
      - store_artifacts:
          path: dist

  deploy-preview:
    working_directory: ~/d-labs-website
    docker:
      - image: dlabspotsdam/website-build:latest
    steps:
      - attach_workspace:
          at: ~/d-labs-website
      - run:
          name: deploy astro to the preview bucket
          command: aws s3 sync ./dist/ s3://preview.d-labs.com --delete

workflows:
  version: 2
  release:
    jobs:
      # Jekyll still builds and deploys production, untouched.
      - build:
          context: website
          filters:
            branches:
              only: master
      - deploy:
          context: website
          requires:
            - build
          filters:
            branches:
              only: master

      # Every other branch previews the Astro site instead.
      - build-astro:
          context: website
          filters:
            branches:
              ignore: master
      - deploy-preview:
          context: website
          requires:
            - build-astro
          filters:
            branches:
              ignore: master
      - hold-invalidate-cache:
          type: approval
          requires:
            - deploy
          filters:
            branches:
              only: master
      - invalidate-cache:
          context: website
          requires:
            - hold-invalidate-cache
          filters:
            branches:
              only: master
